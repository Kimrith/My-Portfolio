<section class="lg:py-20 bg-white dark:bg-[#0a0f1e] transition-colors duration-500">
  <div class="max-w-4xl mx-auto px-6 w-full">
    <div class="text-center mb-16 animate-fade-in">
      <h2 class="text-4xl md:text-6xl font-bold text-gray-900 dark:text-white mb-6">
        {{ 'contact.LETS' | translate }}
        <span class="text-blue-600">{{ 'contact.CONNECT' | translate }}</span>
      </h2>
      <p class="text-gray-600 dark:text-gray-400 text-lg mx-auto max-w-xl">
        {{ 'contact.DESCRIPTION' | translate }}
      </p>
    </div>

    <!-- Contact Cards Grid -->
    <div class="space-y-4">
      <div
        *ngFor="let method of contactMethods"
        class="flex items-center p-4 bg-white dark:bg-gray-800/40 rounded-2xl border border-gray-100 dark:border-gray-700/50 shadow-sm transition-all"
        [class.hover:scale-105]="!method.disabled"
        [class.opacity-50]="method.disabled"
        [class.grayscale]="method.disabled"
        [class.cursor-not-allowed]="method.disabled"
      >
        <!-- Icon Container -->
        <div
          [class]="
            method.color +
            ' w-12 h-12 flex items-center justify-center bg-gray-50 dark:bg-gray-900/50 rounded-xl mr-4 text-xl'
          "
        >
          <i [class]="method.icon"></i>
        </div>

        <!-- Text Content -->
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">
            {{ method.label }}
          </p>

          <!-- Show Link only if not disabled -->
          <ng-container
            *ngIf="
              (method.label === 'Telegram' || method.label === 'LinkedIn') && !method.disabled;
              else plainText
            "
          >
            <a
              [href]="method.value"
              target="_blank"
              class="text-blue-600 dark:text-blue-400 font-medium hover:underline transition-all"
            >
              {{ method.label === 'Telegram' ? '@cheykimrith' : 'View Profile' }}
            </a>
          </ng-container>

          <!-- Plain Text for Phone, Location, or Disabled LinkedIn -->
          <ng-template #plainText>
            <p class="text-gray-900 dark:text-white font-medium" [class.italic]="method.disabled">
              {{ method.value }}
            </p>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</section>
