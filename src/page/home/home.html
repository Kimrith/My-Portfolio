<section
  class="min-h-screen flex items-center justify-center text-gray-900 dark:text-white overflow-hidden relative"
>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"
  ></div>

  <div class="container mx-auto max-sm:p-12 px-6 grid md:grid-cols-2 gap-16 items-center z-10">
    <div class="space-y-8 animate-fade-in">
      <h1 class="text-5xl md:text-7xl font-bold leading-tight">
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-500 animate-gradient-shimmer"
        >
          {{ 'home.NAME' | translate }}
        </span>
      </h1>

      <div class="space-y-4 animate-fade-in-up">
        <h2 class="text-xl md:text-2xl font-medium text-purple-400 italic">
          {{ 'home.WELCOME' | translate }}
        </h2>
        <p class="text-gray-400 max-w-lg text-lg leading-relaxed border-l-4 border-purple-500 pl-4">
          {{ 'home.TITLE' | translate }}
        </p>
      </div>

      <div class="flex flex-wrap gap-4 pt-4 justify-center md:justify-start">
        <button
          routerLink="/"
          fragment="projects"
          class="w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-600 rounded-full font-semibold text-white hover:scale-105 transition-all shadow-[0_0_20px_rgba(147,51,234,0.3)] active:scale-95"
        >
          {{ 'home.VIEW_WORK' | translate }}
        </button>

        <button
          routerLink="/"
          fragment="contact"
          class="w-full sm:w-auto px-8 py-3 border border-gray-300 dark:border-gray-700 rounded-full font-semibold text-gray-900 dark:text-white hover:bg-gray-100 dark:hover:bg-white/5 transition-colors active:scale-95"
        >
          {{ 'home.CONTACT' | translate }}
        </button>
      </div>
      <div class="flex"></div>
    </div>

    <div class="relative flex justify-center items-center">
      <div
        class="relative z-20 w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border-2 border-purple-500/30 shadow-[0_0_50px_rgba(147,51,234,0.2)] animate-float"
      >
        <img
          src="profile/my-profile.png"
          class="w-full h-full object-cover"
          [alt]="'home.NAME' | translate"
        />
      </div>
    </div>
  </div>
</section>
