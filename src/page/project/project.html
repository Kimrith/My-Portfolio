<section class="py-20 lg:pt-52 bg-white dark:bg-[#0a0f1e] transition-colors duration-500">
  <div class="container mx-auto px-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-4">
      <div>
        <h2 class="text-3xl md:text-5xl font-bold text-gray-900 dark:text-white">
          {{ 'project.FEATURED' | translate }}
          <span class="text-blue-600">{{ 'project.TITLE' | translate }}</span>
        </h2>
        <p class="text-gray-600 dark:text-gray-400 mt-4">
          {{ 'project.SUBTITLE' | translate }}
        </p>
      </div>
    </div>

    <!-- Project Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let project of projects" (click)="showLocalAlert(project.title)"
        class="group cursor-pointer ... transition-all duration-500 hover:-translate-y-2">
        <!-- Project Image / Preview -->
        <div class="relative h-52 overflow-hidden bg-gray-200 dark:bg-gray-700">
          <img [src]="project.image" [alt]="project.title"
            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
          <div
            class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-6">
            <div class="flex gap-4">
              <a [href]="project.github"
                class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white hover:text-black transition-colors">
                <i class="fab fa-github"></i>
              </a>
              <a [href]="project.link"
                class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white hover:text-black transition-colors">
                <i class="fas fa-external-link-alt"></i>
              </a>
            </div>
          </div>
        </div>

        <!-- Project Content -->
        <div class="p-8">
          <div class="flex flex-wrap gap-2 mb-4">
            <span *ngFor="let t of project.tech"
              class="px-3 py-1 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 text-[10px] font-bold uppercase rounded-lg border border-blue-100 dark:border-blue-800">
              {{ t }}
            </span>
          </div>

          <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-3 group-hover:text-blue-600 transition-colors">
            {{ project.title }}
          </h3>

          <p class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed mb-6">
            {{ project.description }}
          </p>

          <button
            class="flex items-center gap-2 text-sm font-bold text-gray-900 dark:text-white group-hover:gap-4 transition-all">
            Case Study <i class="fas fa-chevron-right text-[10px] text-blue-600"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
